# notify 邮件通知工具配置示例
# 复制到 ~/.notify/config.ini 后，替换邮箱占位值并填写授权码。

[smtp]
server = smtp.qq.com
port = 465
# auto: 465 使用 SSL，25/587 使用 STARTTLS；也可设置 ssl / starttls / none
ssl = auto
timeout = 15

[auth]
sender_name = notify
sender_email = your-account@qq.com
# QQ/163 等邮箱请填写 SMTP 授权码，不是邮箱登录密码。
sender_pass =

[mail]
receiver_email = recipient@example.com
